[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    unit: Unit tests (deselect with '-m "not unit"')
    integration: Integration tests requiring MongoDB
    e2e: End-to-end pipeline tests
    api: FastAPI contract tests
    performance: Latency and load tests
    slow: Tests that take more than 10s
asyncio_mode = auto
